[tools]
go = "1.27.1"
buf = "1.66.1"
golangci-lint = "2.14.0"

[tasks.generate]
description = "Generate contract code"
run = "buf generate"

[tasks.lint]
run = ["buf lint", "golangci-lint run ./..."]

[tasks.test]
run = "go test ./..."

[tasks.build]
description = "Build all Go packages"
run = "go build ./..."

[tasks."test:unit"]
run = "go test -short ./..."

[tasks."test:integration"]
run = "go test -tags=integration ./..."

[tasks."test:e2e"]
run = "go test -tags=e2e ./test/e2e/..."

[tasks."test:race"]
run = "go test -race ./..."

[tasks."test:all"]
depends = ["test", "test:race"]

[tasks.check]
run = ["mise run generate", "mise run lint", "mise run test", "mise run build"]

[tasks.up]
run = "docker-compose up -d --wait"

[tasks.down]
run = "docker-compose down"