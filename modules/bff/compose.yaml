services:
  bff-service:
    image: distributed-programming-bff:local
    build:
      context: ./modules/bff
      dockerfile: Dockerfile
    environment:
      BFF_MYSQL_ADDRESS: mysql:3306
      BFF_AMQP_URL: amqp://local:local@rabbitmq:5672/
      BFF_DEPENDENCIES_USER_ADDRESS: user-service:8081
    ports:
      - "${BFF_GRPC_PORT:-8081}:8081"
      - "${BFF_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

