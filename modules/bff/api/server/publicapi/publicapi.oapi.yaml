openapi: 3.0.0
info:
  title: BFF public API
  version: 1.0.0
  x-api-identifier: bffpublicapi
paths:
  /api/bff/v1/me:
    get:
      operationId: getMe
      parameters: [{ $ref: '#/components/parameters/authUser' }]
      responses:
        '200': { description: Current user profile, content: { application/json: { schema: { $ref: '#/components/schemas/profile' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
    put:
      operationId: updateMe
      parameters: [{ $ref: '#/components/parameters/authUser' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/profileInput' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/profile' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '409': { $ref: '#/components/responses/conflict' }
        '503': { $ref: '#/components/responses/unavailable' }
components:
  parameters:
    authUser:
      name: X-Auth-User
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    profileInput:
      type: object
      required: [displayName, firstName, lastName, email]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 255 }
        firstName: { type: string, minLength: 1, maxLength: 255 }
        lastName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
    profile:
      allOf:
        - $ref: '#/components/schemas/profileInput'
        - type: object
          required: [userID]
          properties: { userID: { type: string, format: uuid } }
    error:
      type: object
      required: [message]
      properties: { message: { type: string } }
  responses:
    badRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    notFound: { description: User not found, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    conflict: { description: Email is already in use, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    unavailable: { description: Dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
