services:
  registerer-service:
    image: distributed-programming-registerer:local
    build:
      context: ./modules/registerer
      dockerfile: Dockerfile
    environment:
      REGISTERER_MYSQL_ADDRESS: mysql:3306
      REGISTERER_AMQP_URL: amqp://local:local@rabbitmq:5672/
      REGISTERER_DEPENDENCIES_AUTH_ADDRESS: auth-service:8081
      REGISTERER_DEPENDENCIES_USER_ADDRESS: user-service:8081
      REGISTERER_DEPENDENCIES_SESSION_ADDRESS: session-service:8081
      REGISTERER_COOKIE_SECURE: "false"
      REGISTERER_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
    ports:
      - "${REGISTERER_GRPC_PORT:-8081}:8081"
      - "${REGISTERER_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      session-service:
        condition: service_started
