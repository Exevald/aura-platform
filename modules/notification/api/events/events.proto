syntax = "proto3";
package notificationEvents;
option go_package = "/.;notificationevents";
message NotificationCreated { string notification_id = 1; string user_id = 2; string workspace_id = 3; string kind = 4; string title = 5; string body = 6; bool email_requested = 7; int64 occurred_at_unix = 8; string recipient_email = 9; }
