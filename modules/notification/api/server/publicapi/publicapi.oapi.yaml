openapi: 3.0.0
info: { version: 1.0.0, title: Notification API, x-api-identifier: notificationpublicapi }
paths:
  /api/notifications/v1/notifications:
    get:
      operationId: listNotifications
      parameters: [ { $ref: '#/components/parameters/authUser' } ]
      responses:
        '200': { description: Notifications, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/notification' } } } } }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/notifications/v1/notifications/{notificationID}/read:
    put:
      operationId: markNotificationRead
      parameters: [ { $ref: '#/components/parameters/authUser' }, { name: notificationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Marked read }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/notifications/v1/preferences:
    get:
      operationId: getPreferences
      parameters: [ { $ref: '#/components/parameters/authUser' } ]
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/preferences' } } } }
    put:
      operationId: putPreferences
      parameters: [ { $ref: '#/components/parameters/authUser' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/preferences' } } } }
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/preferences' } } } }
        '503': { $ref: '#/components/responses/unavailable' }
components:
  parameters:
    authUser: { name: X-Auth-User, in: header, required: true, schema: { type: string, format: uuid } }
  schemas:
    notification:
      type: object
      required: [id, kind, title, body, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceID: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    preferences:
      type: object
      required: [inApp, email]
      properties: { inApp: { type: boolean }, email: { type: boolean } }
    error: { type: object, required: [message], properties: { message: { type: string } } }
  responses:
    notFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    unavailable: { description: Unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
