syntax = "proto3";
package accessEvents;

option go_package = "/.;accessevents";

message ModuleAccessChanged {
  string type = 1;
  string id = 2;
  string user_id = 3;
  string module_id = 4;
  string effect = 5;
  int64 occurred_at_unix = 6;
}
message GroupModuleAccessGranted {
  string share_id = 1;
  string module_id = 2;
  string group_id = 3;
  int32 member_count = 4;
  int64 occurred_at_unix = 5;
}
message GroupModuleAccessRejected {
  string share_id = 1;
  string module_id = 2;
  string group_id = 3;
  string reason = 4;
  int64 occurred_at_unix = 5;
}
message GroupModuleAccessRevoked {
  string share_id = 1;
  string module_id = 2;
  string group_id = 3;
  string reason = 4;
  int64 occurred_at_unix = 5;
}
