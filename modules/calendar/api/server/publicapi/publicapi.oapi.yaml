openapi: 3.0.0
info: { version: 1.0.0, title: Calendar API, x-api-identifier: calendarpublicapi }
paths:
  /api/calendar/v1/calendars:
    get:
      operationId: listCalendars
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' } ]
      responses:
        '200': { description: Calendars, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/calendar' } } } } }
        '503': { $ref: '#/components/responses/unavailable' }
    post:
      operationId: createCalendar
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/calendarInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/calendar' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/calendar/v1/calendars/{calendarID}:
    get:
      operationId: getCalendar
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' }, { $ref: '#/components/parameters/calendarID' } ]
      responses:
        '200': { description: Calendar, content: { application/json: { schema: { $ref: '#/components/schemas/calendar' } } } }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
    put:
      operationId: updateCalendar
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' }, { $ref: '#/components/parameters/calendarID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/calendarInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/calendar' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
    delete:
      operationId: deleteCalendar
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' }, { $ref: '#/components/parameters/calendarID' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/calendar/v1/calendars/{calendarID}/events:
    get:
      operationId: listEvents
      parameters:
        - { $ref: '#/components/parameters/authUser' }
        - { $ref: '#/components/parameters/workspace' }
        - { $ref: '#/components/parameters/calendarID' }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/event' } } } } }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
    post:
      operationId: createEvent
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' }, { $ref: '#/components/parameters/calendarID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/eventInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/event' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/calendar/v1/events/{eventID}:
    put:
      operationId: updateEvent
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' }, { $ref: '#/components/parameters/eventID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/eventUpdate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/event' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '503': { $ref: '#/components/responses/unavailable' }
    delete:
      operationId: deleteEvent
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspace' }, { $ref: '#/components/parameters/eventID' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
components:
  parameters:
    authUser: { name: X-Auth-User, in: header, required: true, schema: { type: string, format: uuid } }
    workspace: { name: X-Workspace-ID, in: header, required: true, schema: { type: string, format: uuid } }
    calendarID: { name: calendarID, in: path, required: true, schema: { type: string, format: uuid } }
    eventID: { name: eventID, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    calendarInput:
      type: object
      required: [name, timezone]
      properties: { name: { type: string, minLength: 1, maxLength: 120 }, timezone: { type: string, minLength: 1, maxLength: 80 } }
    calendar:
      allOf:
        - { $ref: '#/components/schemas/calendarInput' }
        - type: object
          required: [id, workspaceID, ownerUserID, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            workspaceID: { type: string, format: uuid }
            ownerUserID: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    attendee:
      type: object
      required: [email, status]
      properties:
        userID: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, accepted, declined, tentative] }
    reminder:
      type: object
      required: [minutesBefore, inApp, email]
      properties:
        minutesBefore: { type: integer, minimum: 0, maximum: 525600 }
        inApp: { type: boolean }
        email: { type: boolean }
    eventInput:
      type: object
      required: [title, description, startsAt, endsAt, timezone, attendees, reminders]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        rrule: { type: string }
        attendees: { type: array, items: { $ref: '#/components/schemas/attendee' } }
        reminders: { type: array, items: { $ref: '#/components/schemas/reminder' } }
    eventUpdate:
      allOf:
        - { $ref: '#/components/schemas/eventInput' }
        - type: object
          required: [version]
          properties: { version: { type: integer, format: int64, minimum: 1 } }
    event:
      allOf:
        - { $ref: '#/components/schemas/eventInput' }
        - type: object
          required: [id, calendarID, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            calendarID: { type: string, format: uuid }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    error: { type: object, required: [message], properties: { message: { type: string } } }
  responses:
    badRequest: { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    notFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    unavailable: { description: Unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
