syntax = "proto3";
package calendarEvents;
option go_package = "/.;calendarevents";
message CalendarChanged { string calendar_id = 1; string workspace_id = 2; string actor_user_id = 3; string action = 4; int64 occurred_at_unix = 5; }
message EventChanged { string event_id = 1; string calendar_id = 2; string workspace_id = 3; string actor_user_id = 4; string action = 5; int64 occurred_at_unix = 6; }
message ReminderRequested { string idempotency_key = 1; string event_id = 2; string user_id = 3; string workspace_id = 4; string title = 5; string body = 6; bool in_app = 7; bool email = 8; int64 deliver_at_unix = 9; }
