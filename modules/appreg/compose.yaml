services:
  appreg-service:
    image: distributed-programming-appreg:local
    build:
      context: ./modules/appreg
      dockerfile: Dockerfile
    environment:
      APPREG_MYSQL_ADDRESS: mysql:3306
      APPREG_AMQP_URL: amqp://local:local@rabbitmq:5672/
      APPREG_CATALOGUE_PATH: /config/apps.yaml
    ports:
      - "${APPREG_GRPC_PORT:-8081}:8081"
      - "${APPREG_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  appreg-message-handler:
    image: distributed-programming-appreg:local
    command: [message-handler]
    environment:
      APPREG_MYSQL_ADDRESS: mysql:3306
      APPREG_AMQP_URL: amqp://local:local@rabbitmq:5672/
      APPREG_CATALOGUE_PATH: /config/apps.yaml
    ports:
      - "${APPREG_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      appreg-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
