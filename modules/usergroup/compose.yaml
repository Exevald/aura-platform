services:
  usergroup-service:
    image: distributed-programming-usergroup:local
    build:
      context: ./modules/usergroup
      dockerfile: Dockerfile
    environment:
      USERGROUP_MYSQL_ADDRESS: mysql:3306
      USERGROUP_AMQP_URL: amqp://local:local@rabbitmq:5672/
      USERGROUP_DEPENDENCIES_USER_ADDRESS: user-service:8081
    ports:
      - "${USERGROUP_GRPC_PORT:-8081}:8081"
      - "${USERGROUP_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  usergroup-message-handler:
    image: distributed-programming-usergroup:local
    command: [message-handler]
    environment:
      USERGROUP_MYSQL_ADDRESS: mysql:3306
      USERGROUP_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${USERGROUP_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      usergroup-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
