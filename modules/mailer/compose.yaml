services:
  mailer-service:
    image: distributed-programming-mailer:local
    build:
      context: ./modules/mailer
      dockerfile: Dockerfile
    environment:
      MAILER_MYSQL_ADDRESS: mysql:3306
      MAILER_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${MAILER_GRPC_PORT:-8081}:8081"
      - "${MAILER_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mailer-message-handler:
    image: distributed-programming-mailer:local
    command: [message-handler]
    environment:
      MAILER_MYSQL_ADDRESS: mysql:3306
      MAILER_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${MAILER_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      mailer-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
