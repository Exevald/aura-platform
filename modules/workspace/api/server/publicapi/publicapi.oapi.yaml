openapi: 3.0.0
info: { version: 1.0.0, title: Workspace public API, x-api-identifier: workspacepublicapi }
paths:
  /api/workspaces/v1/workspaces:
    get:
      operationId: listWorkspaces
      parameters: [ { $ref: '#/components/parameters/authUser' } ]
      responses:
        '200': { description: Workspaces, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/workspace' } } } } }
        '503': { $ref: '#/components/responses/unavailable' }
    post:
      operationId: createWorkspace
      parameters: [ { $ref: '#/components/parameters/authUser' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/createWorkspace' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/workspace' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/workspaces/v1/workspaces/{workspaceID}:
    get:
      operationId: getWorkspace
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' } ]
      responses:
        '200': { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/workspace' } } } }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
    delete:
      operationId: deleteWorkspace
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/workspaces/v1/workspaces/{workspaceID}/members:
    put:
      operationId: putWorkspaceMember
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/putMember' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/workspace' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/workspaces/v1/workspaces/{workspaceID}/members/{userID}:
    delete:
      operationId: removeWorkspaceMember
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' }, { name: userID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/workspaces/v1/workspaces/{workspaceID}/invitations:
    get:
      operationId: listWorkspaceInvitations
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' } ]
      responses:
        '200': { description: Invitations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/invitation' } } } } }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
    post:
      operationId: createWorkspaceInvitation
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/createInvitation' } } } }
      responses:
        '201': { description: Invitation created, content: { application/json: { schema: { $ref: '#/components/schemas/invitation' } } } }
        '400': { $ref: '#/components/responses/badRequest' }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/workspaces/v1/workspaces/{workspaceID}/invitations/{invitationID}:
    delete:
      operationId: revokeWorkspaceInvitation
      parameters: [ { $ref: '#/components/parameters/authUser' }, { $ref: '#/components/parameters/workspaceID' }, { name: invitationID, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/notFound' }
        '503': { $ref: '#/components/responses/unavailable' }
  /api/workspaces/v1/invitations/{token}/accept:
    post:
      operationId: acceptWorkspaceInvitation
      parameters: [ { $ref: '#/components/parameters/authUser' }, { name: token, in: path, required: true, schema: { type: string, minLength: 32, maxLength: 128 } } ]
      responses:
        '200': { description: Workspace joined, content: { application/json: { schema: { $ref: '#/components/schemas/workspace' } } } }
        '404': { $ref: '#/components/responses/notFound' }
        '409': { $ref: '#/components/responses/conflict' }
        '503': { $ref: '#/components/responses/unavailable' }
components:
  parameters:
    authUser: { name: X-Auth-User, in: header, required: true, schema: { type: string, format: uuid } }
    workspaceID: { name: workspaceID, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    role: { type: string, enum: [owner, editor, viewer] }
    member:
      type: object
      required: [userID, role, createdAt]
      properties:
        userID: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/role' }
        createdAt: { type: string, format: date-time }
    workspace:
      type: object
      required: [id, kind, name, role, members, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [personal, team] }
        name: { type: string }
        role: { $ref: '#/components/schemas/role' }
        members: { type: array, items: { $ref: '#/components/schemas/member' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    createWorkspace:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 120 } }
    putMember:
      type: object
      required: [userID, role]
      properties:
        userID: { type: string, format: uuid }
        role: { type: string, enum: [editor, viewer] }
    createInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        userID: { type: string, format: uuid }
        role: { type: string, enum: [editor, viewer] }
    invitation:
      type: object
      required: [id, workspaceID, email, role, token, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        workspaceID: { type: string, format: uuid }
        userID: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [editor, viewer] }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    error:
      type: object
      required: [message]
      properties: { message: { type: string } }
  responses:
    badRequest: { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    notFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
    unavailable: { description: Unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/error' } } } }
