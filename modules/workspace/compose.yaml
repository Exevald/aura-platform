services:
  workspace-service:
    image: distributed-programming-workspace:local
    build:
      context: ./modules/workspace
      dockerfile: Dockerfile
    environment:
      WORKSPACE_MYSQL_ADDRESS: mysql:3306
      WORKSPACE_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${WORKSPACE_GRPC_PORT:-8081}:8081"
      - "${WORKSPACE_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  workspace-message-handler:
    image: distributed-programming-workspace:local
    command: [message-handler]
    environment:
      WORKSPACE_MYSQL_ADDRESS: mysql:3306
      WORKSPACE_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${WORKSPACE_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      workspace-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
