services:
  auth-service:
    image: distributed-programming-auth:local
    build:
      context: ./modules/auth
      dockerfile: Dockerfile
    environment:
      AUTH_MYSQL_ADDRESS: mysql:3306
      AUTH_AMQP_URL: amqp://local:local@rabbitmq:5672/
      AUTH_DEPENDENCIES_SESSION_ADDRESS: session-service:8081
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
    ports:
      - "${AUTH_GRPC_PORT:-8081}:8081"
      - "${AUTH_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      session-service:
        condition: service_started
