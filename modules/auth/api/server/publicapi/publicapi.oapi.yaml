openapi: 3.0.0
info:
  version: 1.0.0
  title: Auth service public API
  x-api-identifier: authpublicapi
paths:
  /api/public/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/loginRequest" }
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/authResult" }
        "400": { $ref: "#/components/responses/badRequest" }
        "401": { $ref: "#/components/responses/unauthorized" }
        "503": { $ref: "#/components/responses/unavailable" }
  /api/public/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
        "503": { $ref: "#/components/responses/unavailable" }
  /api/public/v1/auth/change-password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/changePasswordRequest" }
      responses:
        "204":
          description: Password changed
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
        "400": { $ref: "#/components/responses/badRequest" }
        "401": { $ref: "#/components/responses/unauthorized" }
        "503": { $ref: "#/components/responses/unavailable" }
components:
  schemas:
    loginRequest:
      type: object
      required: [ login, password, rememberMe ]
      properties:
        login: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        rememberMe: { type: boolean }
    changePasswordRequest:
      type: object
      required: [ currentPassword, newPassword ]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    authResult:
      type: object
      required: [ userID, authenticated ]
      properties:
        userID: { type: string, format: uuid }
        authenticated: { type: boolean }
        expiresAt: { type: string, format: date-time }
    error:
      type: object
      required: [ message ]
      properties:
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
  responses:
    badRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/error" }
    unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/error" }
    unavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/error" }
