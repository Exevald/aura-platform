services:
  gateway:
    image: distributed-programming-gateway:local
    build:
      context: ./modules/gateway
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
      - '15000:15000'
    volumes:
      - ./modules/gateway/config:/config:ro
    depends_on:
      auth-service: { condition: service_started }
      bff-service: { condition: service_started }
      editor-service: { condition: service_started }
      session-service: { condition: service_started }
      access-service: { condition: service_started }
      frontend: { condition: service_started }
