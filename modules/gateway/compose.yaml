services:
  gateway-service:
    image: distributed-programming-gateway:local
    build:
      context: ./modules/gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_MYSQL_ADDRESS: mysql:3306
      GATEWAY_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${GATEWAY_GRPC_PORT:-8081}:8081"
      - "${GATEWAY_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway-message-handler:
    image: distributed-programming-gateway:local
    command: [message-handler]
    environment:
      GATEWAY_MYSQL_ADDRESS: mysql:3306
      GATEWAY_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${GATEWAY_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      gateway-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
